<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TimesTableGO — UI 预览（重构后新版）</title>
<style>
  :root{
    --green:#246B45; --blue:#2F6F8F; --red:#B23A48;
    --bg:#F7F7F2; --surface:#FFFFFF; --surface-variant:#EDF1EC;
    --on-surface:#182027; --on-surface-var:#59636E; --primary-container:#D8EADD;
    --radius:20px; --radius-sm:12px; --radius-pill:999px;
  }
  *{box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{margin:0;background:#e9ece7;color:var(--on-surface);padding:32px 16px;display:flex;flex-wrap:wrap;gap:32px;justify-content:center;}
  h1{width:100%;text-align:center;font-size:20px;color:#3a3f3a;margin:0 0 8px;}
  .sub{width:100%;text-align:center;color:#6c6f75;font-size:13px;margin:0 0 16px;}
  .phone{width:330px;background:var(--bg);border-radius:34px;box-shadow:0 18px 50px rgba(0,0,0,.18);overflow:hidden;border:8px solid #111;}
  .appbar{display:flex;align-items:center;gap:12px;background:var(--surface);padding:14px 18px;box-shadow:0 1px 0 rgba(0,0,0,.05);}
  .mic{width:34px;height:34px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;}
  .appbar .title{font-weight:700;font-size:16px;}
  .body{padding:20px;display:flex;flex-direction:column;gap:18px;}
  .grad-card{background:linear-gradient(160deg,var(--green),var(--blue));border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;box-shadow:0 8px 22px rgba(36,107,69,.25);}
  .pill{background:rgba(255,255,255,.18);padding:6px 14px;border-radius:var(--radius-pill);font-size:14px;}
  .q{font-size:46px;font-weight:800;line-height:1;}
  .ring{width:74px;height:74px;border-radius:50%;border:6px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;position:relative;}
  .ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:6px solid transparent;border-top-color:#fff;transform:rotate(36deg);}
  .feedback{text-align:center;opacity:.92;font-size:14px;}
  .row{display:flex;gap:12px;justify-content:center;}
  .btn{border:none;border-radius:var(--radius-pill);padding:12px 22px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;color:#fff;}
  .btn.green{background:var(--green);}
  .btn.red{background:var(--red);}
  .btn.outline{background:#fff;border:1.5px solid var(--green);color:var(--green);}
  .chip{background:var(--surface-variant);color:var(--on-surface-var);padding:12px;border-radius:var(--radius-sm);text-align:center;font-size:14px;}
  .card{background:var(--surface-variant);border-radius:16px;padding:16px;}
  .card .head{font-weight:700;margin-bottom:4px;}
  .card .desc{font-size:13px;color:var(--on-surface-var);}
  .switch{width:46px;height:26px;border-radius:999px;background:var(--green);position:relative;}
  .switch::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;}
  .header-card{background:var(--primary-container);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px;}
  .header-card .h{font-size:22px;font-weight:800;color:#0C3320;}
  .header-card .d{font-size:13px;color:#0C3320;opacity:.8;}
  .field{background:var(--surface-variant);border-radius:16px;padding:14px;}
  .field label{display:block;font-size:13px;color:var(--on-surface-var);margin-bottom:8px;}
  .field input{border:1.5px solid #d5dad4;border-radius:10px;padding:10px 12px;width:100%;font-size:15px;background:#fff;}
  .label{font-weight:700;font-size:15px;margin-top:4px;}
  .ver{font-size:13px;color:var(--on-surface-var);}
</style>
</head>
<body>
  <h1>TimesTableGO · 乘法口诀背诵 — UI 预览</h1>
  <p class="sub">重构后新版（练习 + 设置两页）· 设计语言：绿色品牌色 / 渐变题目卡 / 环形倒计时 / 胶囊按钮</p>

  <!-- 练习页 -->
  <div class="phone">
    <div class="appbar">
      <div class="mic">🎤</div>
      <div class="title">乘法口诀背诵</div>
    </div>
    <div class="body">
      <div class="grad-card">
        <div class="pill">请作答</div>
        <div class="q">7 × 8 = ?</div>
        <div class="ring">3</div>
        <div class="feedback">请在 3 秒内说出答案。</div>
        <div class="feedback" style="opacity:.85;font-size:13px;">识别：五十六</div>
      </div>
      <div class="row">
        <button class="btn red">■ 停止</button>
        <button class="btn outline">⚙ 设置</button>
      </div>
      <div class="chip">已保存 128 条本地记录。</div>
    </div>
  </div>

  <!-- 设置页 -->
  <div class="phone">
    <div class="appbar">
      <div class="mic">🎤</div>
      <div class="title">设置</div>
    </div>
    <div class="body">
      <div class="header-card">
        <div class="h">设置</div>
        <div class="d">音频、答题节奏与离线更新都在本机完成。</div>
      </div>
      <div class="card" style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="head">题目音频</div>
          <div class="desc">内置中文音频，不联网。</div>
        </div>
        <div class="switch"></div>
      </div>
      <div class="field">
        <label>答题时间（秒）</label>
        <input value="3" />
      </div>
      <div class="label">应用更新</div>
      <div class="ver">当前版本 0.1.9（10）</div>
      <button class="btn green" style="width:100%;justify-content:center;">检查更新</button>
      <button class="btn outline" style="width:100%;justify-content:center;border-color:var(--green);">返回练习</button>
    </div>
  </div>
</body>
</html>

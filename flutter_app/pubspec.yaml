name: timestablego
description: Offline bilingual multiplication practice.
publish_to: none
version: 0.2.0+13
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  path_provider: 2.1.6
  crypto: 3.0.7
  record: 7.1.1
  sherpa_onnx: 1.13.8
  audioplayers: ^6.5.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/asr/manifest.json
    - assets/asr/sensevoice/
    - assets/asr/vad/
    - assets/asr/LICENSES/
    - assets/licenses/
